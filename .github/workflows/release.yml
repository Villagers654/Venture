# A version tag (v1.2.3, or v1.2.3-rc1 for a pre-release) builds every download from source, runs the
# tests on those builds, and attaches them to a draft GitHub Release; the release text is reviewed before it is published.
# Only DeliciousMeatPop/Venture-UnknownSourceEdition builds releases.
name: Release

on:
  push:
    tags: ["v*"]
  # Run on a tag ("Use workflow from" > Tags) to rebuild that release's downloads.
  workflow_dispatch:
    inputs:
      skip_upstream_check:
        description: "Skip the check for newer upstream Venture changes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  # Before building, see whether upstream Venture (Villagers654/Venture) has something this fork does not:
  # a newer stable release, or new commits on its main. If it does, the run warns and the next job
  # waits for your approval (Review deployments > Approve to build anyway, Reject to stop and merge first).
  # Setup, once: Settings > Environments > New environment "upstream-newer" > Required reviewers: you
  # (leave "Prevent self-review" off).
  upstream-check:
    if: github.repository == 'DeliciousMeatPop/Venture-UnknownSourceEdition'
    runs-on: ubuntu-24.04
    outputs:
      newer: ${{ steps.check.outputs.newer }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare with upstream
        id: check
        env:
          UPSTREAM: https://github.com/Villagers654/Venture.git
          SKIP: ${{ inputs.skip_upstream_check }}
        run: |
          newer=false
          ours=$(sed -n 's/^project(Venture VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          # Upstream's tags: the newest stable (no "-") and the newest of any kind.
          tags=$(git ls-remote --tags --refs "$UPSTREAM" 'v*' | sed 's|.*refs/tags/v||')
          stable=$(printf '%s\n' "$tags" | grep -v -- '-' | sort -V | tail -1)
          latest=$(printf '%s\n' "$tags" | sort -V | tail -1)
          # Commits on upstream's main that this commit does not contain.
          git fetch -q --no-tags "$UPSTREAM" main:refs/remotes/upstream/main
          behind=$(git rev-list --count HEAD..refs/remotes/upstream/main)
          {
            echo "### Upstream check"
            echo "| | |"; echo "|---|---|"
            echo "| This fork's version | \`$ours\` |"
            echo "| Upstream newest stable | \`${stable:-none}\` |"
            echo "| Upstream newest (any) | \`${latest:-none}\` |"
            echo "| Upstream main commits not in this build | $behind |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SKIP" = "true" ]; then
            echo "Upstream check skipped by request." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ -n "$stable" ] && [ "$stable" != "$ours" ] && [ "$(printf '%s\n%s\n' "$ours" "$stable" | sort -V | tail -1)" = "$stable" ]; then
              echo "::warning title=Newer upstream release::Upstream Venture v$stable is newer than this fork's $ours. Merge or port it first, or approve to build anyway."
              newer=true
            fi
            if [ "$behind" -gt 0 ]; then
              echo "::warning title=Upstream has new commits::Upstream main is $behind commit(s) ahead of this build. Merge it first, or approve to build anyway."
              newer=true
            fi
            if [ -n "$latest" ] && [ "$latest" != "$stable" ] && [ "$latest" != "$ours" ]; then
              echo "::notice title=Upstream pre-release::Upstream has a pre-release, v$latest (not gating)."
            fi
          fi
          echo "newer=$newer" >> "$GITHUB_OUTPUT"

  # Runs only when the check found something newer; the environment pauses it until you approve or reject.
  upstream-confirm:
    needs: upstream-check
    if: needs.upstream-check.outputs.newer == 'true'
    runs-on: ubuntu-24.04
    environment: upstream-newer
    steps:
      - run: 'echo "Approved - building without upstream newer changes."'

  windows:
    needs: [upstream-check, upstream-confirm]
    if: ${{ !cancelled() && github.repository == 'DeliciousMeatPop/Venture-UnknownSourceEdition' && needs.upstream-check.result == 'success' && (needs.upstream-confirm.result == 'success' || needs.upstream-confirm.result == 'skipped') }}
    uses: ./.github/workflows/windows.yml
    with:
      test: true
      package: true
  linux:
    needs: [upstream-check, upstream-confirm]
    if: ${{ !cancelled() && github.repository == 'DeliciousMeatPop/Venture-UnknownSourceEdition' && needs.upstream-check.result == 'success' && (needs.upstream-confirm.result == 'success' || needs.upstream-confirm.result == 'skipped') }}
    uses: ./.github/workflows/linux.yml
    with:
      test: true
      package: true

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tag only
        run: '[[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "Run this on a v* tag"; exit 1; }'
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
          else
            flags=(--draft --verify-tag --generate-notes --title "Venture ${version}")
            [[ "$version" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" assets/* "${flags[@]}" -R "$GITHUB_REPOSITORY"
          fi
